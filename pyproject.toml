[tool.poetry]
name = "serverless-todo-app"
version = "0.1.0"
description = "DDD-Lite Serverless App on LocalStack"
authors = ["Medallion13 <nickcar13@gmail.com>"]
readme = "README.md"
packages = [{ include = "backend" }, { include = "infrastructure" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.7"
boto3 = "^1.34"
aws-lambda-powertools = "^2.30"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
httpx = "^0.25.0"
boto3-stubs = { extras = [
    "dynamodb",
    "cognito-idp",
    "lambda",
], version = "^1.34" }
commitizen = "^4.10.0"

[tool.poetry.group.infra.dependencies]
aws-cdk-lib = "^2.110"
constructs = "^10.0.0"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true

allowed_prefixes = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "chore",
    "ci",
]

# Patrón de validación simple
[tool.commitizen.customize]
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\\(\\w+\\))?!?:\\s.+"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

#------- tool configurations -------#

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
exclude = [
    ".git",
    "__pycache__",
    "cdk.out",      # Build cdk
    ".venv",
    "node_modules", # frontend modules
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
    "W",  # warnings
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
# Le decimos a ruff que "backend" e "infrastructure" son módulos nuestros
known-first-party = ["backend", "infrastructure"]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["backend/tests"] # Apuntamos a nuestros tests
python_files = "test_*.py"
addopts = """
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
"""
markers = [
    "unit: tests unitarios puros",
    "integration: tests que requieren localstack",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["cdk.out", "node_modules", "backend/tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "aws_cdk.*", "my_constructs.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "infrastructure/*",
    "backend/infrastructure/lambda_handlers/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
